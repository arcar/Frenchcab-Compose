services:

  backend: 
    image: arcar13/frenchcab-backend:latest

    ports: 
      - "127.0.0.1:3001:3001"
  
  gateway:
    image: arcar13/frenchcab-gateway:latest
    environment:
      - BACKEND_URL=http://backend:3001

    # env_file:
    #   - name=value
    
    ports:
      - "3000:3000"
    
  frontend:

    image: arcar13/frenchcab-frontend:latest

    ports:
      - "127.0.0.1:4200:4200"

    # volumes:
    #   - /app/node_modules

    depends_on:
      - gateway

