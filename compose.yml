services:

  backend:
    image: arcar13/frenchcab-backend:latest

    ports:
      - "127.0.0.1:3001:3001"

  gateway:
    image: arcar13/frenchcab-gateway:latest
    environment:
      - BACKEND_URL=http://backend:3001

    ports:
      - "3000:3000"

  frontend:
    image: arcar13/frenchcab-frontend:latest

    # Port du front sur l'hôte : 4200 en local, 80 sur la VM (FRONT_PORT dans .env)
    ports:
      - "${FRONT_PORT:-4200}:80"

    depends_on:
      - gateway
