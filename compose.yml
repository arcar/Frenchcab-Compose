services:

  backend:
    image: arcar13/frenchcab-backend:latest

    # Base relationnelle et modèle ML (non versionnés) dans ./data,
    # conservés entre deux déploiements (les réservations y sont écrites)
    environment:
      - DB_RELATIONNELLE=/data/frenchcab_relationnelle.db
      - MODEL_PATH=/data/modele_temps_trajet.pkl
    volumes:
      - ./data:/data

    ports:
      - "127.0.0.1:3001:3001"

  gateway:
    image: arcar13/frenchcab-gateway:latest
    environment:
      - BACKEND_URL=http://backend:3001

    ports:
      - "3000:3000"

  frontend:
    image: arcar13/frenchcab-frontend:latest

    # Port du front sur l'hôte (FRONT_PORT dans .env, 4200 par défaut)
    ports:
      - "${FRONT_PORT:-4200}:80"

    depends_on:
      - gateway
