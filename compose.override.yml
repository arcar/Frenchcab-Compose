services:

  backend:
    container_name: Frenchcab-Backend

    build:
      context: ./Frenchcab-Backend
      dockerfile: ./Dockerfile

    # En local : base et modèle générés directement dans le repo backend
    environment:
      - DB_RELATIONNELLE=/app/ETL/frenchcab_relationnelle.db
      - MODEL_PATH=/app/ML/modele_temps_trajet.pkl

    volumes:
      
      - /app/node_modules
      - ./Frenchcab-Backend:/app

  gateway:
    container_name: Frenchcab-Gateway

    build:
      context: ./Frenchcab-Gateway
      dockerfile: ./Dockerfile
    
    volumes:
      - /app/node_modules
      - ./Frenchcab-Gateway:/app

  frontend:
    container_name: frenchcab-frontend

    build:
      context: ./Frenchcab-Frontend
      dockerfile: ./Dockerfile
      # Build Angular en development : le front appelle la gateway sur localhost
      args:
        BUILD_CONFIG: development

    volumes:
      - /app/node_modules
      - ./Frenchcab-Frontend:/app